name: atrio-leilao

x-node-env: &node-env
  PORT: 3000
  DATA_DIR: /data
  CLUSTER_NODES: "1=http://node1:3000,2=http://node2:3000,3=http://node3:3000,4=http://node4:3000,5=http://node5:3000"
  CONTROL_TOKEN: "lab-local-demo"
  CLUSTER_INITIAL_ACTIVE: "1,2,3"

x-node: &node-base
  build: .
  restart: unless-stopped
  networks: [leilao]

services:
  node1:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 1
    ports: ["127.0.0.1:3001:3000"]
    volumes: ["node1_data:/data"]
  node2:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 2
    ports: ["127.0.0.1:3002:3000"]
    volumes: ["node2_data:/data"]
  node3:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 3
    ports: ["127.0.0.1:3003:3000"]
    volumes: ["node3_data:/data"]
  node4:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 4
    ports: ["127.0.0.1:3004:3000"]
    volumes: ["node4_data:/data"]
  node5:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 5
    ports: ["127.0.0.1:3005:3000"]
    volumes: ["node5_data:/data"]
  dashboard:
    <<: *node-base
    command: ["node", "dashboard/server.js"]
    environment:
      PORT: 8080
      DATA_DIR: /data
      CLUSTER_INITIAL_ACTIVE: "1,2,3"
      CLUSTER_NODES: "1=http://node1:3000,2=http://node2:3000,3=http://node3:3000,4=http://node4:3000,5=http://node5:3000"
      CONTROL_TOKEN: "lab-local-demo"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["dashboard_data:/data"]
    depends_on: [node1, node2, node3, node4, node5]

networks:
  leilao:
    driver: bridge
volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data:
  dashboard_data:
